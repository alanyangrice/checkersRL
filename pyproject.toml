[project]
name = "checkersRL"
version = "0.1.0"
description = "Reinforcement learning for checkers: PPO and AlphaZero (MCTS)"
requires-python = ">=3.10"

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["web/", ".venv/", "__pycache__/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
